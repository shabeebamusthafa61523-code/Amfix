<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- <link rel="shortcut icon" href="/favicon.ico" /> -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AMFIX Enterprise CRM</title>
    <script>
      (function() {
        const theme = localStorage.getItem('theme');
        if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div style="position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #ffffff; color: #4C259A; z-index: 99999; font-family: system-ui, -apple-system, sans-serif;">
        <div style="margin-bottom: 2rem;">
          <img src="/splash_logo.png" alt="AMFIX ACADEMY Logo" style="height: 140px;" />
        </div>
        <div style="width: 160px; height: 4px; background: rgba(76, 37, 154, 0.15); border-radius: 9999px; overflow: hidden; position: relative;">
          <div style="width: 50%; height: 100%; background: #4C259A; border-radius: 9999px; animation: loadingBar 1.4s infinite ease-in-out;"></div>
        </div>
        <p style="margin-top: 1.25rem; font-size: 11px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: #4C259A;">Initializing AMFIX Academy...</p>
        <style>
          @keyframes pulseGlow {
            0%, 100% { transform: scale(0.9); opacity: 0.4; }
            50% { transform: scale(1.25); opacity: 0.8; }
          }
          @keyframes loadingBar {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(200%); }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
